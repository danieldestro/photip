services:
  mysql:
    image: mysql:9
    restart: unless-stopped
    # innodb-ft-min-token-size=2 (padrão é 3): nomes reais de evento têm tokens
    # de 2 caracteres com significado ("5k", "8k", UFs) que o índice FULLTEXT
    # (ver migration eventos_fulltext) precisa indexar. Em produção (Railway),
    # o mesmo parâmetro precisa ser aplicado via Settings → Deploy → Custom
    # Start Command do serviço MySQL — senão o comportamento diverge
    # silenciosamente entre dev e prod (ver RAILWAY.md).
    command: --innodb-ft-min-token-size=2
    environment:
      MYSQL_DATABASE: photip
      MYSQL_USER: photip
      MYSQL_PASSWORD: photip
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
